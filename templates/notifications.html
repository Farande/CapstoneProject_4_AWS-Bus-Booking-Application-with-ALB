<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | TransitFlow AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <div class="brand-wrap">
            <div class="brand"><span class="brand-mark">T</span>TransitFlow</div>
            <small class="brand-subtitle">alerts</small>
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/buses">Routes</a>
            <a href="/assistant">AI</a>
        </nav>
    </div>
</header>

<section class="page-shell">
    <div class="page-hero">
        <div>
            <p class="eyebrow">Communication center</p>
            <h1>Notifications</h1>
        </div>
        <span class="status-pill">3 active</span>
    </div>

    <div class="panel-card">
        <h2>Latest updates</h2>
        <div class="stack-list">
            {% for item in notifications %}
            <div class="smart-item notification-card">
                <div class="notification-header">
                    <strong>{{ item.title }}</strong>
                    <span class="sent-time">{{ item.time }}</span>
                </div>
                <p>{{ item.message }}</p>
                <span class="chip {{ item.type }}">{{ item.type }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

</body>
</html>
