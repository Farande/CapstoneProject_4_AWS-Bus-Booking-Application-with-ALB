<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TransitFlow AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-header">
    <div class="container">
        <div class="brand-wrap">
            <div class="brand"><span class="brand-mark">T</span>TransitFlow</div>
            <small class="brand-subtitle">create account</small>
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </nav>
    </div>
</header>

<div class="form-shell">
    <form class="form-card" method="post" action="{{ url_for('auth.register') }}">
        <h2>Create account</h2>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create password" required>
        </div>

        <button type="submit" class="submit-btn">Register</button>

        <p>Already have an account? <a href="/login">Login</a></p>
    </form>
</div>

</body>
</html>
